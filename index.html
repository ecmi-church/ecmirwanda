<title>Evangelical Church and Ministries International - ECMI RWANDA</title>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
    }

    body {
        overflow: hidden;
        background: #ffffff;
    }

    /* =========================
       LOADING SCREEN
       ========================= */

    #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        z-index: 9999;
        text-align: center;
    }

    /* ECMI IMAGE */

    #loader img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
        margin-bottom: 20px;
    }

    /* Loading title */

    #loader h2 {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #003366;
        font-size: 22px;
        font-weight: 600;
    }

    /* Loading animation */

    .loading-text {
        margin-top: 12px;
        font-family: Arial, sans-serif;
        color: #666666;
        font-size: 14px;
    }

    .dots {
        display: inline-block;
        width: 24px;
        text-align: left;
    }

    /* Small loading spinner */

    .spinner {
        width: 32px;
        height: 32px;
        margin-top: 18px;
        border: 4px solid #e6e6e6;
        border-top: 4px solid #003366;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    /* =========================
       APPS SCRIPT WEBSITE
       ========================= */

    #website {
        display: block;
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border: 0;
    }

    /* Mobile adjustment */

    @media (max-width: 600px) {

        #loader img {
            width: 140px;
            height: 140px;
        }

        #loader h2 {
            font-size: 19px;
        }

        .loading-text {
            font-size: 13px;
        }

        .spinner {
            width: 28px;
            height: 28px;
        }
    }
</style>
```

</head>

<body>

```
<!-- =========================
     LOADING SCREEN
     ========================= -->

<div id="loader">

    <!-- ECMI RWANDA IMAGE FROM GOOGLE DRIVE -->
    <img
        src="https://drive.google.com/thumbnail?id=1EF4yZBkLe4aM8fEiwSeKu_qx7iVx44h2&sz=w1000"
        alt="ECMI Rwanda"
    >

    <h2>ECMI RWANDA</h2>

    <div class="loading-text">
        Loading website<span class="dots">...</span>
    </div>

    <div class="spinner"></div>

</div>


<!-- =========================
     ECMI RWANDA WEBSITE
     ========================= -->

<iframe
    id="website"
    src="https://script.google.com/macros/s/AKfycbyVg9Ql9kBgMvAVy5QxEOZuLngnrCwuPUvFSI2d8EAtb2V1HmBi5fByAW_x9r0tR3ZDPg/exec"
    title="Evangelical Church and Ministries International - ECMI RWANDA"
    frameborder="0"
    scrolling="yes">
</iframe>


<!-- =========================
     LOADING SCRIPT
     ========================= -->

<script>

    const iframe = document.getElementById("website");
    const loader = document.getElementById("loader");

    /*
     * Hide loading screen when
     * the Apps Script website
     * has finished loading.
     */

    iframe.addEventListener("load", function () {

        loader.style.opacity = "0";
        loader.style.transition = "opacity 0.5s ease";

        setTimeout(function () {
            loader.style.display = "none";
        }, 500);

    });

</script>
