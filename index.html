<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ECMI RWANDA</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #ffffff;
}

/* Loading screen */

#loader {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background: #ffffff;

    z-index: 9999;

}

#loader img {

    width: 55px;

    height: 55px;

}

#loader h2 {

    font-family: Arial, sans-serif;

    color: #003366;

    font-size: 20px;

}

/* Apps Script website */

#website {

    display: block;

    width: 100%;

    height: 100vh;

    min-height: 100vh;

    border: 0;

}

</style>

</head>

<body>

<div id="loader">

    <img
        src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Loading_2.gif"
        alt="Loading"
    >

    <h2>Loading ECMI RWANDA...</h2>

</div>


<iframe
    id="website"
    src="https://script.google.com/macros/s/AKfycbz5zUjIGn9coVpbKXOfPFnzhdg5AETtDLUqVphZAMVwNmirSSxMA4J5Nwg_SW5OJIr0RQ/exec"
    title="ECMI RWANDA"
    frameborder="0"
    scrolling="yes">
</iframe>


<script>

const iframe =
    document.getElementById("website");

const loader =
    document.getElementById("loader");


iframe.addEventListener("load", function () {

    loader.style.display = "none";

});

</script>

</body>
</html>
